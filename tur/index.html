<style>
/* The drone photograph is the stage. It is drawn with depth, so pressing and dragging turns the building.
   Choosing a level moves the camera only: the photograph is never brightened, dimmed or outlined.
   A slim level index sits on the right; the chosen level's name sits low on the left, over the hedges.
   Rooms open as untouched photographs. One dark navy look. */
:root{
  --navy:#0b1626; --glass:rgba(9,17,29,.76); --line:rgba(233,220,196,.18);
  --ivory:#f6f1e7; --sand:#e4d5b8; --gold:#d4b47a; --muted:rgba(246,241,231,.72);
  --f-display:"Cormorant Garamond",Georgia,"Times New Roman",serif; --f-caps:"Cinzel",Georgia,serif; --f-body:"Montserrat",system-ui,-apple-system,sans-serif;
  --ease:cubic-bezier(.2,.7,.2,1);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--navy);color:var(--ivory);font-family:var(--f-body);font-size:14px;line-height:1.5;overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
:focus-visible{outline:1px solid var(--gold);outline-offset:4px}
#app{position:fixed;inset:0;overflow:hidden;overflow:clip;background:var(--navy)}

/* ---------- building ---------- */
#heroBg{position:absolute;inset:0;z-index:0;overflow:hidden}
#heroBg::before{content:"";position:absolute;inset:-60px;background:url(img/hero_lqip.jpg) center/cover;filter:blur(36px) brightness(.42);transform:scale(1.1)}
#gl{position:absolute;inset:0;width:100%;height:100%;z-index:1;display:block;touch-action:none;cursor:grab}
#fallback{position:absolute;left:0;top:0;z-index:1;max-width:none;transform-origin:0 0;touch-action:none;cursor:grab;-webkit-user-drag:none}
#gl.drag,#fallback.drag{cursor:grabbing}
#gl.point,#fallback.point{cursor:pointer}
#pins{position:absolute;inset:0;z-index:3;pointer-events:none;overflow:hidden}
.pin{position:absolute;left:0;top:0;padding:9px;pointer-events:none;opacity:0;transition:opacity .55s ease;will-change:transform}
.pin.on{opacity:1;pointer-events:auto}
.pin i{display:block;position:relative;width:13px;height:13px;border-radius:50%;background:var(--gold);box-shadow:0 0 0 1.5px var(--ivory),0 0 0 4px rgba(11,22,38,.5),0 4px 14px rgba(0,0,0,.45);transition:transform .25s ease}
.pin i::after{content:"";position:absolute;inset:-8px;border-radius:50%;border:1px solid rgba(246,241,231,.75);animation:ring 2.8s cubic-bezier(.2,.6,.3,1) infinite}
@keyframes ring{from{transform:scale(.5);opacity:.9}to{transform:scale(1.5);opacity:0}}
.pin span{position:absolute;left:50%;bottom:calc(100% - 3px);transform:translateX(-50%);white-space:nowrap;font-family:var(--f-caps);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--ivory);background:rgba(9,17,29,.8);border:1px solid var(--line);padding:5px 11px 4px;border-radius:999px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);transition:opacity .25s,background .25s,color .25s,border-color .25s}
.pin.lft span{left:auto;right:50%;transform:translateX(16px)}
.pin.rgt span{transform:translateX(-16px)}
.pin.below span{bottom:auto;top:calc(100% - 3px)}
.pin.nolab span{opacity:0}
.pin.nolab:hover span,.pin.nolab:focus-visible span{opacity:1;z-index:1}
.pin:hover,.pin:focus-visible{z-index:2}
.pin:hover i,.pin:focus-visible i{transform:scale(1.18)}
.pin:hover span,.pin:focus-visible span{background:var(--ivory);color:var(--navy);border-color:var(--ivory)}
.pin.soon{pointer-events:none}
.pin.soon i{background:rgba(11,22,38,.35);box-shadow:0 0 0 1.5px var(--ivory),0 4px 14px rgba(0,0,0,.45)}
.pin.soon i::after{display:none}
.pin.soon span{color:var(--sand)}

/* ---------- room photographs ---------- */
#stage{position:absolute;inset:0;z-index:4;pointer-events:none}
#stage .shot{position:absolute;inset:0;opacity:0;overflow:hidden;background:var(--navy)}
#stage .shot img{width:100%;height:100%;object-fit:cover;display:block;will-change:transform;backface-visibility:hidden;pointer-events:none;-webkit-user-drag:none}
.room-mode #stage{pointer-events:auto;touch-action:pan-y}

.scrim{position:absolute;inset:0;z-index:2;pointer-events:none;transition:opacity .8s ease}
.scrim.s-top{background:linear-gradient(180deg,rgba(4,9,17,.42) 0,rgba(4,9,17,0) 150px)}
.scrim.s-cap{background:radial-gradient(60% 32% at 0% 100%,rgba(4,9,17,.78) 0,rgba(4,9,17,.52) 42%,rgba(4,9,17,.16) 74%,rgba(4,9,17,0) 100%),linear-gradient(0deg,rgba(4,9,17,.34) 0,rgba(4,9,17,0) 150px)}
.scrim.s-room{z-index:5;opacity:0;background:radial-gradient(56% 44% at 0% 100%,rgba(4,9,17,.5) 0,rgba(4,9,17,.22) 55%,rgba(4,9,17,0) 100%),linear-gradient(0deg,rgba(4,9,17,.9) 0,rgba(4,9,17,.68) 120px,rgba(4,9,17,.34) 240px,rgba(4,9,17,0) 360px)}
.room-mode .scrim.s-cap,.flying .scrim.s-cap,.intro .scrim.s-cap{opacity:0}
.room-mode .scrim.s-room{opacity:1}

.brand{position:absolute;z-index:7;top:max(22px,env(safe-area-inset-top,0px));left:max(28px,env(safe-area-inset-left,0px));transform-origin:0 0;transition:transform .7s var(--ease),opacity .9s ease}
.brand img{display:block;height:116px;width:auto;filter:drop-shadow(0 3px 16px rgba(0,0,0,.55))}
.room-mode .brand{transform:scale(.76)}
.intro .brand{opacity:0}

/* ---------- level index ---------- */
.rail{position:absolute;z-index:7;right:max(30px,env(safe-area-inset-right,0px));top:56%;transform:translateY(-50%);display:flex;flex-direction:column;align-items:center;width:62px;padding:15px 0 9px;border-radius:31px;background:rgba(9,17,29,.5);border:1px solid rgba(233,220,196,.17);backdrop-filter:blur(14px) saturate(1.1);-webkit-backdrop-filter:blur(14px) saturate(1.1);box-shadow:0 14px 40px rgba(0,0,0,.28);transition:opacity .7s ease .15s,transform .7s var(--ease) .15s}
.rail .lbl{font-family:var(--f-caps);font-size:8.5px;letter-spacing:.38em;margin:0 -.38em 5px 0;color:var(--gold)}
.rail ol{list-style:none;margin:0;padding:0;position:relative;display:flex;flex-direction:column}
.rail .ind{position:absolute;left:8px;top:0;margin-top:22px;width:4px;height:4px;border-radius:50%;background:var(--gold);box-shadow:0 0 10px rgba(212,180,122,.85);opacity:0;transition:transform .8s var(--ease),opacity .5s}
.lv{position:relative;display:flex;align-items:center;justify-content:center;width:62px;height:48px}
.lv .n{font-family:var(--f-display);font-size:27px;line-height:1;color:rgba(246,241,231,.5);font-variant-numeric:lining-nums;transition:color .45s ease,transform .7s var(--ease)}
.lv:hover .n,.lv.peek .n{color:var(--ivory)}
.lv[aria-pressed="true"] .n{color:var(--ivory);transform:scale(1.36)}
.lv .t{position:absolute;right:calc(100% + 14px);top:50%;transform:translate(8px,-50%);opacity:0;white-space:nowrap;pointer-events:none;font-family:var(--f-caps);font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;background:var(--glass);border:1px solid var(--line);padding:6px 12px 5px;border-radius:999px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);transition:opacity .25s,transform .3s}
.lv:hover .t,.lv:focus-visible .t{opacity:1;transform:translate(0,-50%)}
.intro .rail,.flying .rail,.room-mode .rail{opacity:0;pointer-events:none;transform:translateY(-50%) translateX(14px);transition-delay:0s}

/* ---------- level caption ---------- */
.cap{position:absolute;z-index:7;left:max(40px,env(safe-area-inset-left,0px));bottom:max(34px,env(safe-area-inset-bottom,0px));max-width:calc(100vw - 260px);display:flex;align-items:flex-end;gap:30px;text-shadow:0 2px 16px rgba(0,0,0,.6);transition:opacity .7s ease .2s}
.cap .lead{flex:none}
.cap .k{font-family:var(--f-caps);font-size:11px;letter-spacing:.34em;text-transform:uppercase;color:var(--gold)}
.cap h2{margin:6px 0 0;font-family:var(--f-display);font-style:italic;font-weight:400;font-size:clamp(40px,3.7vw,56px);line-height:1;letter-spacing:.004em;white-space:nowrap}
.cap .aside{min-width:0;padding:2px 0 3px 30px;border-left:1px solid rgba(246,241,231,.3)}
.cap p{margin:0;font-size:13px;color:var(--muted);max-width:58ch;text-wrap:balance}
.cap .k,.cap p,.cta{text-shadow:0 1px 3px rgba(0,0,0,.55),0 1px 14px rgba(0,0,0,.6)}
.cta{margin-top:10px;display:inline-flex;align-items:center;gap:12px;font-family:var(--f-caps);font-size:11.5px;letter-spacing:.24em;text-transform:uppercase;padding:0 0 6px;border-bottom:1px solid rgba(212,180,122,.75);white-space:nowrap;transition:color .3s,border-color .3s}
.cta svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round;transition:transform .35s var(--ease)}
.cta:hover{color:var(--gold)}
.cta:hover svg{transform:translateX(5px)}
.cta[disabled]{cursor:default;color:var(--muted);border-color:rgba(246,241,231,.22);font-family:var(--f-display);font-style:italic;font-size:16px;letter-spacing:.01em;text-transform:none}
.cta[disabled] svg{display:none}
.ctas{display:flex;align-items:center;gap:28px;margin-top:10px}
.ctas .cta{margin-top:0}
.cta.alt,.cta.alt[hidden]{display:none!important}
.snd-m{display:none;width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--glass);place-items:center;margin-left:auto}
.snd-m svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.facts{display:flex;flex-wrap:wrap;align-items:center;row-gap:4px;margin-top:9px;font-family:var(--f-caps);font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--sand);text-shadow:0 1px 3px rgba(0,0,0,.55),0 1px 14px rgba(0,0,0,.6)}
.facts:empty{display:none}
.facts span{white-space:nowrap}
.facts span+span::before{content:"";display:inline-block;width:1px;height:10px;margin:0 12px 0 13px;background:rgba(212,180,122,.6);vertical-align:-1px}
.cap .lead,.cap .aside>*,.cap .chips{transition:opacity .45s ease,transform .7s var(--ease),filter .45s ease}
.cap .aside>p{transition-delay:.07s}.cap .facts{transition-delay:.1s}.cap .ctas{transition-delay:.14s}.cap .chips{transition-delay:.1s}
.cap.out .lead,.cap.out .aside>*,.cap.out .chips{opacity:0;transform:translateY(8px);filter:blur(3px);transition-delay:0s}
.chips{display:none;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px 0}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:flex;align-items:center;gap:8px;background:var(--glass);border:1px solid var(--line);border-radius:999px;padding:4px 13px 4px 4px;font-size:12.5px;font-weight:500;white-space:nowrap;text-shadow:none}
.chip img{width:28px;height:28px;border-radius:50%;object-fit:cover}
.intro .cap,.flying .cap,.room-mode .cap{opacity:0;pointer-events:none;transition-delay:0s}

/* tag that follows the pointer over the building */
.htag{position:absolute;z-index:8;left:0;top:0;pointer-events:none;display:flex;align-items:center;gap:12px;padding:5px 18px 5px 5px;border-radius:999px;background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:0 10px 30px rgba(0,0,0,.35);opacity:0;transition:opacity .22s ease}
.htag img{width:46px;height:46px;border-radius:50%;object-fit:cover;display:block}
.htag.noimg{padding-left:18px}
.htag.noimg img{display:none}
.htag b{display:block;font-family:var(--f-caps);font-weight:400;font-size:9.5px;letter-spacing:.3em;text-transform:uppercase;color:var(--gold);line-height:1.2}
.htag span{display:block;font-family:var(--f-display);font-style:italic;font-size:22px;line-height:1.1;white-space:nowrap}
.hint{position:absolute;z-index:8;left:50%;top:max(34px,env(safe-area-inset-top,0px));transform:translateX(-50%);white-space:nowrap;pointer-events:none;font-family:var(--f-caps);font-size:10.5px;letter-spacing:.24em;text-transform:uppercase;background:var(--glass);border:1px solid var(--line);padding:9px 18px 8px;border-radius:999px;opacity:0;transition:opacity .9s;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}

/* ---------- room view ---------- */
.ctl{position:absolute;z-index:7;top:max(22px,env(safe-area-inset-top,0px));right:max(22px,env(safe-area-inset-right,0px));display:flex;gap:8px;opacity:0;pointer-events:none;transition:opacity .6s}
.ib{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--glass);display:grid;place-items:center;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);transition:border-color .25s}
.ib svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.ib:hover{border-color:var(--gold)}
.ib.wide{width:auto;padding:0 18px;border-radius:999px;display:flex;gap:9px;font-family:var(--f-caps);font-size:11px;letter-spacing:.22em;text-transform:uppercase}
.title{position:absolute;z-index:6;left:max(30px,env(safe-area-inset-left,0px));right:max(30px,env(safe-area-inset-right,0px));bottom:max(122px,calc(env(safe-area-inset-bottom,0px) + 122px));pointer-events:none}
.title .k{font-family:var(--f-caps);font-size:11px;letter-spacing:.32em;text-transform:uppercase;color:var(--gold);text-shadow:0 1px 3px rgba(0,0,0,.6),0 1px 14px rgba(0,0,0,.6)}
.title h3{margin:6px 0 0;font-family:var(--f-display);font-style:italic;font-weight:400;font-size:clamp(38px,4.4vw,60px);line-height:1;text-shadow:0 1px 3px rgba(0,0,0,.35),0 2px 26px rgba(0,0,0,.55)}
.title p{margin:8px 0 0;font-family:var(--f-caps);font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--sand);text-shadow:0 1px 3px rgba(0,0,0,.6),0 1px 14px rgba(0,0,0,.6)}
.title>*{opacity:0;transition:opacity .6s ease}
.title.on>*{opacity:1}
.room{position:absolute;z-index:7;left:0;right:0;bottom:0;padding:0 max(28px,env(safe-area-inset-right,0px)) max(20px,env(safe-area-inset-bottom,0px)) max(28px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px;opacity:0;pointer-events:none;transition:opacity .6s}
.room-mode .room{opacity:1;pointer-events:auto}
#app:not(.intro):not(.flying) .ctl{opacity:1;pointer-events:auto}
.ctl .ro{display:none!important}
.room-mode .ctl .ro{display:grid!important}
.room-mode .ctl .ro.wide{display:flex!important}
.ib[hidden]{display:none!important}
/* between levels the chosen level's name sits low on the left, over its own shade */
.between .scrim.s-cap{opacity:1}

/* ---------- gallery: every photograph, by level and room ---------- */
.gal{position:absolute;inset:0;z-index:12;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;background:#070d17;opacity:0;visibility:hidden;transition:opacity .5s ease,visibility 0s linear .5s}
.gal.open{opacity:1;visibility:visible;transition:opacity .5s ease}
.gh{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:30px;padding:max(20px,env(safe-area-inset-top,0px)) max(36px,env(safe-area-inset-right,0px)) 16px max(36px,env(safe-area-inset-left,0px));background:rgba(7,13,23,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.gh .gt{flex:none}
.gh .k,.gsec .k{font-family:var(--f-caps);font-size:10.5px;letter-spacing:.34em;text-transform:uppercase;color:var(--gold)}
.gh h2{margin:4px 0 0;font-family:var(--f-display);font-style:italic;font-weight:400;font-size:36px;line-height:1}
.gnav{flex:1;min-width:0;display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px}
.gnav::-webkit-scrollbar{display:none}
.gnav button{flex:none;font-family:var(--f-caps);font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);padding:9px 16px 8px;border:1px solid var(--line);border-radius:999px;transition:color .25s,border-color .25s}
.gnav button:hover,.gnav button[aria-current="true"]{color:var(--ivory);border-color:rgba(212,180,122,.65)}
.gbody{padding:6px max(36px,env(safe-area-inset-right,0px)) max(70px,env(safe-area-inset-bottom,0px)) max(36px,env(safe-area-inset-left,0px))}
.gsec{padding-top:44px}
.gsec h3{margin:6px 0 0;font-family:var(--f-display);font-style:italic;font-weight:400;font-size:46px;line-height:1}
.groom{margin-top:26px}
.groom h4{margin:0 0 11px;display:flex;align-items:baseline;gap:12px;font-family:var(--f-caps);font-weight:400;font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--sand)}
.groom h4 small{font-family:var(--f-body);font-size:11px;letter-spacing:.06em;color:rgba(246,241,231,.45)}
.ggrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(216px,1fr));gap:10px}
.gi{position:relative;display:block;width:100%;aspect-ratio:3/2;overflow:hidden;border-radius:3px;background:#0f1c2f}
.gi img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;opacity:0;transition:opacity .6s ease;-webkit-user-drag:none}
.gi img.ld{opacity:1}
.gi::after{content:"";position:absolute;inset:0;border-radius:3px;border:1px solid rgba(246,241,231,.08);transition:border-color .3s,box-shadow .3s;pointer-events:none}
.gi:hover::after,.gi:focus-visible::after{border-color:var(--gold);box-shadow:inset 0 0 0 1px rgba(212,180,122,.5)}
.gi.cur::after{border-color:var(--gold);box-shadow:inset 0 0 0 2px var(--gold)}
.gi:focus-visible{outline:none}
.meta{display:flex;align-items:center;gap:14px}
.prog{flex:1;height:1px;background:rgba(246,241,231,.22);overflow:hidden}
.prog i{display:block;height:100%;width:0;background:var(--gold)}
.count{font-family:var(--f-caps);font-size:10.5px;letter-spacing:.2em;color:var(--sand);font-variant-numeric:tabular-nums;min-width:52px;text-align:right}
.bar{display:flex;align-items:center;gap:12px;min-width:0}
.rooms{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0;padding:2px}
.rooms::-webkit-scrollbar{display:none}
.rc{flex:none;display:flex;align-items:center;gap:9px;background:var(--glass);border:1px solid var(--line);border-radius:999px;padding:4px 15px 4px 4px;font-size:12.5px;font-weight:500;white-space:nowrap;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);transition:border-color .25s,background .25s}
.rc img{width:30px;height:30px;border-radius:50%;object-fit:cover}
.rc:hover{border-color:rgba(212,180,122,.55)}
.rc[aria-current="true"]{border-color:var(--gold);background:rgba(212,180,122,.2)}

/* ---------- opening: the logo draws itself while the tour loads ---------- */
#veil{position:absolute;inset:0;z-index:20;display:grid;place-items:center;background:radial-gradient(110% 85% at 50% 46%,#13243c 0,#0b1626 55%,#060d18 100%);transition:opacity 1.1s ease}
#veil.out{opacity:0;pointer-events:none}
.load{display:flex;flex-direction:column;align-items:center;transition:transform 1.6s var(--ease)}
#veil.out .load{transform:scale(1.06)}
#mark{width:min(240px,50vw);height:auto;overflow:visible;display:block}
#mark path{fill-rule:evenodd}
#mark .mono path{--len:24000;fill:var(--ivory);fill-opacity:0;stroke:var(--gold);stroke-width:14;stroke-linejoin:round;stroke-dasharray:var(--len) var(--len);stroke-dashoffset:var(--len);animation:draw 1.8s cubic-bezier(.55,.05,.25,1) forwards,fillin 1s ease forwards}
#mark .mono .v{animation-delay:.1s,1.35s}
#mark .mono .l{animation-delay:.35s,1.6s}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes fillin{to{fill-opacity:1;stroke-opacity:0}}
#mark .word path{fill:var(--ivory);opacity:0;transform:translateY(120px);animation:rise .9s cubic-bezier(.2,.7,.2,1) forwards;animation-delay:calc(1.45s + var(--i) * 55ms)}
@keyframes rise{to{opacity:1;transform:none}}
#mark .rule{fill:var(--gold);opacity:0;transform-box:fill-box;transform-origin:50% 50%;transform:scaleX(0);transition:transform .9s cubic-bezier(.2,.7,.2,1);animation:show .6s ease .2s forwards}
@keyframes show{to{opacity:1}}
#mark .place path{fill:var(--sand);opacity:0;animation:show .8s ease forwards;animation-delay:calc(2.05s + var(--i) * 60ms)}
#mark .sheen{transform:translateX(-900px);animation:sheen 2.6s cubic-bezier(.45,0,.25,1) 2.7s infinite}
@keyframes sheen{0%{transform:translateX(-900px)}55%,100%{transform:translateX(3300px)}}
.load .vt{margin-top:26px;font-family:var(--f-caps);font-size:10.5px;letter-spacing:.52em;margin-right:-.52em;text-transform:uppercase;color:var(--gold);opacity:0;animation:show 1s ease 2.4s forwards}

@media (max-width:760px),(orientation:portrait) and (max-width:1100px){
  .brand{left:max(20px,env(safe-area-inset-left,0px))}
  .brand img{height:72px}
  .rail{top:max(30px,env(safe-area-inset-top,0px));right:max(14px,env(safe-area-inset-right,0px));transform:none;flex-direction:row;width:auto;height:46px;padding:0 4px;border-radius:23px}
  .rail .lbl{display:none}
  .rail ol{flex-direction:row}
  .rail .ind{left:0;top:auto;bottom:6px;margin:0 0 0 19px}
  .lv{width:42px;height:46px}
  .lv .n{font-size:23px}
  .lv[aria-pressed="true"] .n{transform:scale(1.25)}
  .lv .t{display:none}
  .intro .rail,.flying .rail,.room-mode .rail{transform:translateY(-8px)}
  .cap{left:max(18px,env(safe-area-inset-left,0px));right:max(18px,env(safe-area-inset-right,0px));bottom:max(18px,env(safe-area-inset-bottom,0px));max-width:none;flex-direction:column;align-items:flex-start;gap:0}
  .cap h2{font-size:38px;white-space:normal}
  .cap .aside{display:contents}
  .cap p{order:1;margin-top:8px;font-size:13px}
  .facts{order:2;font-size:9.5px;letter-spacing:.16em}
  .facts span+span::before{margin:0 9px 0 10px}
  .chips{display:flex;order:3;align-self:stretch;margin-top:14px}
  .ctas{order:4;margin-top:16px;gap:24px}
  .cta.alt:not([hidden]){display:inline-flex!important}
  .snd-m{display:inline-grid}
  .ctas{align-self:stretch}
  #app:not(.room-mode) .ctl{opacity:0!important;pointer-events:none!important}
  #bGal{width:44px;padding:0;justify-content:center}
  #bGal span,#bFs{display:none!important}
  .gh{gap:14px;padding:max(14px,env(safe-area-inset-top,0px)) 14px 12px 18px;flex-wrap:wrap}
  .gh .gt{flex:1}
  .gh h2{font-size:30px}
  .gnav{order:3;flex:0 0 100%}
  .gbody{padding:0 14px max(50px,env(safe-area-inset-bottom,0px))}
  .gsec{padding-top:30px}
  .gsec h3{font-size:36px}
  .ggrid{grid-template-columns:repeat(2,1fr);gap:6px}
  .scrim.s-cap{background:linear-gradient(0deg,rgba(4,9,17,.78) 0,rgba(4,9,17,.4) 190px,rgba(4,9,17,0) 310px)}
  .pin span{display:none}
  .pin{padding:12px}
  .hint{top:auto;bottom:270px}
  .title{bottom:max(118px,calc(env(safe-area-inset-bottom,0px) + 118px))}
  .title h3{font-size:36px}
}
/* short landscape screens (phones turned sideways) */
@media (max-height:560px) and (min-width:761px){
  .brand{top:max(14px,env(safe-area-inset-top,0px))}
  .brand img{height:62px}
  .rail{padding:10px 0 6px}
  .rail .lbl{display:none}

  .cap p{display:none}
  .facts{margin-top:2px}
  .ctas{margin-top:8px}

}
@media (prefers-reduced-motion:reduce){

  #mark .mono path{animation:none;fill-opacity:1;stroke-opacity:0}

  #mark .sheen{animation:none;opacity:0}
}

  const side=q[0]>VW-(MOBILE?0:300)?'lft':q[0]<170?'rgt':'';           // keep labels clear of the level index and the edges

// labels never overlap each other or the interface: each sits above its pin, else below, else shows on hover only
function layoutLabels(){
  if(MOBILE||!pinEls.length) return;
  const hit=(a,b)=>a[0]<b[2]&&b[0]<a[2]&&a[1]<b[3]&&b[1]<a[3];
  const taken=[$('cap'),document.querySelector('.rail'),document.querySelector('.brand'),document.querySelector('.ctl')]
    .map(el=>{ const b=el.getBoundingClientRect(); return [b.left-6,b.top-6,b.right+6,b.bottom+6]; });
  const pts=pinEls.map(p=>project(p.r.at[0],p.r.at[1]));
  pts.forEach(q=>taken.push([q[0]-9,q[1]-9,q[0]+9,q[1]+9]));
  // labels are placed from left to right across the building
  pinEls.map((p,k)=>k).sort((a,b)=>pinEls[a].r.at[0]-pinEls[b].r.at[0]).forEach(k=>{ const p=pinEls[k], sp=p.el.querySelector('span'), q=pts[k]; if(!sp) return;
    if(!p.lw){ p.lw=sp.offsetWidth+6; p.lh=sp.offsetHeight+4; }
    const x0=p.side==='lft'?q[0]+16-p.lw:p.side==='rgt'?q[0]-16:q[0]-p.lw/2;
    const up=[x0,q[1]-12.5-p.lh,x0+p.lw,q[1]-12.5], dn=[x0,q[1]+12.5,x0+p.lw,q[1]+12.5+p.lh];
    const free=r=>r[1]>4&&r[3]<VH-4&&!taken.some(t=>hit(r,t));

function inPoly(x,y,poly){ let c=false; for(let i=0,j=poly.length-1;i<poly.length;j=i++){ const xi=poly[i][0],yi=poly[i][1],xj=poly[j][0],yj=poly[j][1]; if(((yi>y)!==(yj>y))&&(x<(xj-xi)*(y-yi)/(yj-yi)+xi)) c=!c; } return c; }
function levelAt(cx,cy){ const r=app.getBoundingClientRect(), q=unproject(cx-r.left,cy-r.top); return LEVELS.findIndex(L=>L.polys.some(p=>inPoly(q[0],q[1],p))); }
let down=null;
function onDown(e){ if(mode!=='levels'||e.button>0) return; down={x:e.clientX,y:e.clientY,lx:Math.atanh(clamp(look.x,-.99,.99)),ly:Math.atanh(clamp(look.y,-.99,.99)),moved:false,hist:[]}; try{ e.currentTarget.setPointerCapture(e.pointerId); }catch(_){} }
function onMove(e){
  const el=e.currentTarget;
  if(down){ const dx=e.clientX-down.x, dy=e.clientY-down.y;
    if(!down.moved&&Math.hypot(dx,dy)>6){ down.moved=true; dragging=true; el.classList.add('drag'); el.classList.remove('point'); hideTag(); setPeek(-1); hideHint(); if(!pulsing) setHover(-1); }
    if(down.moved){ look.x=Math.tanh(down.lx+dx/(VW*.42)); look.y=Math.tanh(down.ly+dy/(VH*.42)); lookV.x=lookV.y=0;
      down.hist.push([performance.now(),look.x,look.y]); if(down.hist.length>6) down.hist.shift(); wake(); }
    return; }
  if(mode!=='levels'||e.pointerType!=='mouse') return;
  const i=levelAt(e.clientX,e.clientY); el.classList.toggle('point',i>=0); setPeek(i);
  if(i!==hoverLv&&!pulsing) setHover(i);
  if(i>=0) showTag(e.clientX,e.clientY,i); else hideTag();
}
function onUp(e){ if(!down) return; const d=down; down=null; e.currentTarget.classList.remove('drag');
  if(d.moved){ dragging=false; const h=d.hist; if(h.length>1){ const a=h[0], b=h[h.length-1], t=(b[0]-a[0])/1000; if(t>.005){ lookV.x=clamp((b[1]-a[1])/t,-4,4); lookV.y=clamp((b[2]-a[2])/t,-4,4); } } wake(); return; }
  if(mode!=='levels') return;
  const i=levelAt(e.clientX,e.clientY);
  if(i>=0){ if(i!==sel){ if(e.pointerType!=='mouse') pulse(i); selectLevel(i); } } else if(sel!==null) selectLevel(null); }
function onCancel(e){ if(down&&down.moved){ dragging=false; wake(); } down=null; e.currentTarget.classList.remove('drag'); }
[cvs,fb].forEach(el=>{ el.addEventListener('pointerdown',onDown); el.addEventListener('pointermove',onMove); el.addEventListener('pointerup',onUp); el.addEventListener('pointercancel',onCancel);
  el.addEventListener('pointerleave',()=>{ if(!down&&mode==='levels'){ hideTag(); setPeek(-1); el.classList.remove('point'); if(!pulsing) setHover(-1); } }); });

const shots=[...document.querySelectorAll('#stage .shot')]; let front=0, moveN=0;
const STEP=6.5;
function startMove(img){ img.getAnimations().forEach(a=>a.cancel()); if(reduce) return;
  const d=(moveN++%2)?1:-1;   // the whole photograph drifts sideways at one scale: nothing inside it bends
  img.animate([{transform:`translate3d(${1.4*d}%,0,0) scale(1.04)`},{transform:`translate3d(${-1.4*d}%,0,0) scale(1.04)`}],{duration:(STEP+1.6)*1000,easing:'linear',fill:'forwards'}); }
async function showPhoto(src,ms,alt){ const ld=await loadImg(src);
  const nxt=shots[1-front], cur=shots[front], im=nxt.querySelector('img'); im.src=(ld&&ld.naturalWidth&&ld.src)||src; im.alt=alt||''; startMove(im);
  nxt.style.transition='none'; nxt.style.opacity=0; nxt.style.zIndex=2; cur.style.zIndex=1; void nxt.offsetWidth;
  nxt.style.transition=`opacity ${reduce?0:ms}ms ease`; nxt.style.opacity=1;
  await wait(ms); cur.style.transition='none'; cur.style.opacity=0; front=1-front; }
function hidePhotos(ms){ shots.forEach(s=>{ s.style.transition=`opacity ${reduce?0:ms}ms ease`; s.style.opacity=0; }); return wait(ms); }

let si=0, playing=true, stepT=0, roomBusy=false, roomRaf=0, roomLast=0, pendingBack=false, pendingJump=null;
const pad2=n=>String(n).padStart(2,'0');
function showTitle(id){ const r=R[id];
  if(r.li===null) $('tK').textContent='Villa Lavaya · Kalkan';
  else { const L=LEVELS[r.li]; $('tK').textContent=`${L.name} · ${pad2(L.rooms.indexOf(id)+1)} / ${pad2(L.rooms.length)}`; }
  $('tT').textContent=r.n; $('tS').textContent=r.s; $('title').classList.add('on'); }
function updateCount(){ const s=SEQ[si]; $('count').textContent=`${s[1]+1} / ${R[s[0]].p.length}`; }
const seqIndex=(id,k)=>SEQ.findIndex(s=>s[0]===id&&s[1]===k);
// the camera moves in towards a room's window while its first photograph fades in
function pushTo(r){ if(!r.at) return Promise.resolve(true);
  const s2=snapS(Math.min(Math.max(cam.s*1.75,1.9),2.7)), S2=base.S*s2, a=area();
  const to=clampT({s:s2,Tx:VW/2-r.at[0]*S2,Ty:(MOBILE?a.y+a.h/2:VH*.48)-r.at[1]*S2});
  h0T=clamp(depthAt(r.at[0]/IW,r.at[1]/IH),0,1);          // the window we fly towards stays put while the rest moves around it
  return animateCam(to,1400,easeIO); }
async function enterRoom(id,k=0){
  if(mode!=='levels') return;

  if(sel!==li){ sel=li; renderRail(); fillCaption(); }

  renderRoomBar(id); markRoom(id); updateCount();
  mode='room'; app.classList.remove('flying'); app.classList.add('room-mode');
  playing=!reduce; setPlay(); stepT=0; roomLast=performance.now(); if(!roomRaf) roomRaf=requestAnimationFrame(roomTick);

}
function roomTick(now){ roomRaf=0; if(mode!=='room') return; const dt=Math.min(.1,(now-roomLast)/1000); roomLast=now;
  if(playing&&!roomBusy){ stepT+=dt; if(stepT>=STEP){ stepT=0; go(si+1,false); } }
  $('prog').style.width=Math.min(100,stepT/STEP*100)+'%'; roomRaf=requestAnimationFrame(roomTick); }
async function go(j,manual){
  if(roomBusy||mode!=='room') return; roomBusy=true; if(manual){ playing=false; setPlay(); }
  const from=SEQ[si][0]; si=(j+SEQ.length)%SEQ.length; const id=SEQ[si][0], k=SEQ[si][1];
  if(R[id].li!==R[from].li) await interlude(id,k);
  else {
    if(id!==from){ markRoom(id); $('title').classList.remove('on'); }
    await showPhoto(srcOf(id,k),id!==from?560:440,`${R[id].n}, photograph ${k+1}`);
    if(id!==from) showTitle(id);
  }
  updateCount(); stepT=0;
  const n=SEQ[(si+1)%SEQ.length]; loadImg(srcOf(n[0],n[1]));
  roomBusy=false;
  if(pendingBack){ pendingBack=false; pendingJump=null; backToLevels(); return; }
  if(pendingJump!==null){ const q=pendingJump; pendingJump=null; if(q!==si) go(q,true); } }

// moving to another level: the photograph clears, the camera rises to that level of the building,
// which takes on the villa's glaze for a moment under its name, then the camera moves in to the room
async function interlude(id,k){
  const r=R[id], li=r.li, L=li===null?null:LEVELS[li], first=loadImg(srcOf(id,k));
  app.classList.remove('room-mode'); app.classList.add('flying','between'); $('title').classList.remove('on');
  await hidePhotos(650);
  sel=li; renderRail(); h0T=H0;
  const glide=animateCam(levelView(li),1600,easeIO);
  await wait(420);
  $('tK').textContent=L?`Level ${L.no}`:'Villa Lavaya · Kalkan'; $('tT').textContent=L?L.name:r.n; $('tS').textContent=L?L.sub:r.s;
  $('title').classList.add('on');
  await wait(300);
  if(L){ for(let q=0;q<4;q++) GLZ.tgt[q]=q===li?1:0; wake(); }
  await Promise.all([glide,first,wait(1700)]);
  for(let q=0;q<4;q++) GLZ.tgt[q]=0; wake();
  $('title').classList.remove('on');
  await wait(380);
  const push=pushTo(r);
  await wait(r.at?720:200);
  showTitle(id); renderRoomBar(id); markRoom(id);
  await showPhoto(srcOf(id,k),620,`${r.n}, photograph ${k+1}`);
  await push;
  app.classList.remove('flying','between'); app.classList.add('room-mode');

  gbody.innerHTML=SECTIONS.map(s=>`<section class="gsec" id="${s.id}"><div class="k">${s.k}</div><h3>${s.t}</h3>${

}

/* =================== MUSIC: lounge music fades in softly with the first touch, click or key =================== */
const MUSIC_VOL=.32, SND_ON='<path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11"/>',
  SND_OFF='<path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path d="M16 9.5l5 5M21 9.5l-5 5"/>';
const music=new Audio(); music.preload='none'; music.loop=true; music.src='audio/lounge.mp3';
let musicOn=true, musicPlaying=false, actx=null, gain=null, fadeRaf=0;
try{ musicOn=localStorage.getItem('lv-music')!=='off'; }catch(e){}
const musicVol=()=>gain?gain.gain.value:music.volume;
const setMusicVol=v=>{ if(gain) gain.gain.value=v; else music.volume=v; };
function fadeMusic(to,ms,done){ cancelAnimationFrame(fadeRaf); const from=musicVol(), t0=performance.now();
  const step=now=>{ const k=reduce?1:Math.min(1,(now-t0)/ms); setMusicVol(from+(to-from)*k); if(k<1) fadeRaf=requestAnimationFrame(step); else if(done) done(); };
  fadeRaf=requestAnimationFrame(step); }
// phones ignore an audio element's volume, so the level goes through a gain node where the browser has one
function audioGraph(){ if(actx) return; const AC=window.AudioContext||window.webkitAudioContext; if(!AC) return;
  try{ actx=new AC(); gain=actx.createGain(); gain.gain.value=0; actx.createMediaElementSource(music).connect(gain).connect(actx.destination); }catch(e){ actx=null; gain=null; } }
const GESTURES=['pointerdown','touchend','click','keydown'];
function playMusic(){   // runs inside the visitor's own touch, click or key press
  audioGraph(); if(actx&&actx.state==='suspended') actx.resume().catch(()=>{});
  setMusicVol(0); const p=music.play();
  const ok=()=>{ musicPlaying=true; GESTURES.forEach(t=>removeEventListener(t,firstGesture,true)); fadeMusic(MUSIC_VOL,2600); };
  if(p&&p.then) p.then(ok).catch(()=>{}); else ok(); }
function pauseMusic(){ fadeMusic(0,700,()=>{ music.pause(); musicPlaying=false; }); }
function setSoundUI(){ ['bSnd','ctaS'].forEach(id=>{ const b=$(id); if(!b) return;
  b.querySelector('svg').innerHTML=musicOn?SND_ON:SND_OFF; b.setAttribute('aria-label',musicOn?'Turn music off':'Turn music on'); b.setAttribute('aria-pressed',String(musicOn)); }); }
function toggleMusic(){ musicOn=!musicOn; try{ localStorage.setItem('lv-music',musicOn?'on':'off'); }catch(e){}
  if(musicOn) playMusic(); else pauseMusic(); setSoundUI(); }
function firstGesture(e){ if(e.target&&e.target.closest&&e.target.closest('#bSnd,#ctaS')) return; if(musicOn&&!musicPlaying) playMusic(); }
GESTURES.forEach(t=>addEventListener(t,firstGesture,true));
['bSnd','ctaS'].forEach(id=>{ const b=$(id); if(b) b.addEventListener('click',e=>{ e.stopPropagation(); toggleMusic(); }); });
document.addEventListener('visibilitychange',()=>{ if(!musicOn||!musicPlaying) return;
  if(document.hidden) music.pause(); else { const p=music.play(); if(p&&p.catch) p.catch(()=>{}); } });
setSoundUI();

addEventListener('keydown',e=>{
  if(galOpen){ if(e.key==='Escape'){ e.preventDefault(); closeGallery(); } return; }
  if((e.key==='g'||e.key==='G')&&!e.metaKey&&!e.ctrlKey&&!e.altKey&&(mode==='levels'||mode==='room')){ openGallery(); return; }
  if(mode==='levels'){
    if(e.key==='ArrowUp'){ e.preventDefault(); selectLevel(sel===null?2:Math.max(0,sel-1)); }
    else if(e.key==='ArrowDown'){ e.preventDefault(); selectLevel(sel===null?2:Math.min(LEVELS.length-1,sel+1)); }
    else if(e.key==='Escape'&&sel!==null) selectLevel(null); }
  else if(mode==='room'){
    if(e.key==='ArrowRight') go(si+1,true); else if(e.key==='ArrowLeft') go(si-1,true);
    else if(e.key==='Escape') backToLevels(); else if(e.key===' '){ e.preventDefault(); $('bPlay').click(); } } });

let rz=0;
addEventListener('resize',()=>{ clearTimeout(rz); rz=setTimeout(()=>{ const wasMobile=MOBILE; layout(); prev=null;
  if(mode==='levels'||mode==='intro'){ if(anim){ anim.res(false); anim=null; } Object.assign(cam,levelView(sel)); if(mode==='levels'&&sel!==null&&!pinEls.length) setPins(sel); }
  dispReady=false; dispW=0; renderRail(); if(wasMobile!==MOBILE||mode!=='room') fillCaption(); wake();
  requestAnimationFrame(()=>{ placePins(); layoutLabels(); }); },120); });

/* =================== LOADING =================== */
const rule=document.querySelector('#mark .rule');
document.querySelectorAll('#mark .mono path').forEach(p=>{ try{ p.style.setProperty('--len',Math.ceil(p.getTotalLength())+4); }catch(e){} });
let progress=0; const setProgress=p=>{ progress=Math.max(progress,p); if(rule) rule.style.transform=`scaleX(${progress})`; };
async function boot(){
  const T0=performance.now();
  layout(); decideHD();
  const glOK=initGL();
  if(!glOK){ cvs.hidden=true; fb.hidden=false; }
  const needBig=!MOBILE&&IW*base.S*DPR>2520;
  const pFonts=(document.fonts&&document.fonts.ready?document.fonts.ready:Promise.resolve()).catch(()=>{}).then(()=>setProgress(.12));
  const pDep=loadImg('d/hero_v3.png').then(img=>{ readDepth(img); if(gl&&img.naturalWidth) upload(texDep,img,false,true); setProgress(.3); });
  loadImg('d/floors.png').then(img=>{ if(gl&&img.naturalWidth){ upload(texMask,img,false,true); maskReady=true; } });
  const pMid=loadImg('img/hero2400.jpg').then(img=>{ IMG.mid=img; fb.src=img.src; setProgress(.55); });
  await Promise.all([pDep,pMid]);
  if(needBig){ const big=await Promise.race([loadImg('img/hero4800.jpg'),wait(9000).then(()=>null)]);
    if(big&&big.naturalWidth){ IMG.big=big; fb.src=big.src; } setProgress(.85); }
  const home=homeView();
  if(gl){ uploadHi(bestImg()); Object.assign(cam,home); buildDisp(); }
  // the tour opens a little closer and settles back into the full view
  const s0=snapS(1.08), S0=base.S*s0, Sh=base.S*home.s, chx=(VW/2-home.Tx)/Sh, chy=(VH/2-home.Ty)/Sh;
  Object.assign(cam,{s:s0,Tx:VW/2-chx*S0,Ty:VH/2-chy*S0});
  render(); setProgress(1);
  await pFonts;
  const left=(reduce?600:3500)-(performance.now()-T0); if(left>0) await new Promise(r=>setTimeout(r,left));
  fillCaption();
  $('veil').classList.add('out'); setTimeout(()=>{ const v=$('veil'); if(v) v.remove(); },1500);
  mode='levels'; app.classList.remove('intro');
  animateCam(home,2800,easeOut);
  setTimeout(showHint,1800);
  setTimeout(()=>{ ['salon','turkuaz','havuz','yesil','bahceoda'].forEach(id=>loadImg(srcOf(id,0))); LEVELS.forEach(L=>{ if(L.lead) loadImg(thOf(L.lead)); }); },2600);
  // on larger screens the full-resolution photograph follows, for close-ups of each level
  if(!MOBILE&&!IMG.big) setTimeout(()=>loadImg('img/hero4800.jpg').then(big=>{ if(!big.naturalWidth) return; IMG.big=big; fb.src=big.src; if(!raf) settle(); }),3200);
}
boot();
})();
